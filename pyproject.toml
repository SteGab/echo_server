[project]
name = "echo-server"
version = "1.0.0"
description = "Ein einfacher Echo-Server, der GET und POST Requests verarbeitet und die empfangenen Daten zurücksendet"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Echo Server"}
]

dependencies = [
    "fastapi>=0.100.0",
    "requests>=2.32.4",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "endpoint: marks tests as endpoint tests",
    "integration: marks tests as integration tests",
]
